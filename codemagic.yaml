workflows:
  fiapay-android:
    name: FiaPay Android
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Baixar dependências
        script: flutter pub get
      - name: Compilar APK
        script: flutter build apk --release -t Lib/main.dart
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
